<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<meta name="robots" content="noindex">
<title>Keyturn</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="screen" id="screen" data-state="loading">
  <header class="brand">
    <img class="mark-sm" src="/mark.svg" alt="">
    <span>Keyturn</span>
  </header>

  <section class="hero">
    <div class="emblem" id="emblem" aria-hidden="true">
      <div class="halo"></div>
      <svg viewBox="0 0 64 64" class="mark-lg">
        <defs>
          <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F7DCA4"/><stop offset=".55" stop-color="#E7B45A"/><stop offset="1" stop-color="#B9832F"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="30" fill="url(#brass)"/>
        <circle cx="32" cy="32" r="30" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>
        <g class="turn">
          <circle cx="32" cy="32" r="19.5" fill="#0C1016"/>
          <circle cx="32" cy="28" r="5.2" fill="url(#brass)"/>
          <path d="M29.3 31.2h5.4l1.7 11.4h-8.8z" fill="url(#brass)"/>
        </g>
      </svg>
      <svg viewBox="0 0 64 64" class="tick"><path d="M19 33.5l8.5 8.5L46 23.5" fill="none" stroke="#0C1016" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="spinner"></div>
    </div>
    <h1 id="title">One moment…</h1>
    <p class="sub" id="sub"></p>
  </section>

  <ul class="facts" id="facts"></ul>

  <footer class="actions">
    <p class="match" id="match" hidden>Check your PC shows <b id="matchCode"></b></p>
    <button class="primary" id="go" type="button" hidden></button>
    <p class="fine" id="fine"></p>
  </footer>
</main>
<script src="/app.js"></script>
</body>
</html>
